name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: './tagmanager'

      - id: tagmanager
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          owner: cmu-sei
          repo: moodle-local_tagmanager
          excludes: prerelease, draft

      - name: package
        run: |
          OLDRELEASE=${{ steps.tagmanager.outputs.release }}
          PREVIOUSVERSION=$(grep "plugin->version" tagmanager/version.php | sed -e "s/.*= \(.*\);.*/\1/")
          if [ $OLDRELEASE -ne $PREVIOUSVERSION ]; then
              NEWVERSION=$PREVIOUSVERSION
          else
              OLDDATE=`echo $PREVIOUSVERSION | cut -b 1-8`
              NEWDATE=`date +%Y%m%d`
              if [ $OLDDATE -ne $NEWDATE ]; then
                  NEWVERSION=$NEWDATE\00
              else
                  OLDVERS=`echo $PREVIOUSVERSION | cut -b 9-10`
                  OLDVERS=${OLDVERS#0}
                  let NEWVERS=(OLDVERS + 1)
                  NEWVERSION=$OLDDATE`printf %02d $NEWVERS`
              fi
              sed -i "s#\(plugin->version.*\)$PREVIOUSVERSION#\1$NEWVERSION#" tagmanager/version.php
              cd ./tagmanager
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add version.php
              git commit -m "Updating version to $NEWVERSION"
              git push
              cd ..
          fi
          zip -r local_tagmanager_$NEWVERSION.zip tagmanager/ -x "tagmanager/*.git*"
          echo "artifact_version=$NEWVERSION" >> $GITHUB_ENV
          echo "artifact_name=local_tagmanager_$NEWVERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.artifact_version }}
          name: ${{ env.artifact_name }}
          files: ${{ env.artifact_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
